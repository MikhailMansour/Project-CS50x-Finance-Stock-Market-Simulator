{% extends "layout.html" %}

{% block title %}
    Portfolio
{% endblock %}

{% block main %}

    <table class="table table-striped">
        <thead>
            <tr>
                <th>Symbol</th>
                <th>Shares</th>
                <th>Price</th>
                <th>TOTAL</th>
            </tr>
        </thead>

        <tbody>
            {% for stock in stocks %}
                <tr>
                    <td>{{ stock.symbol }}</td>
                    <td>{{ stock.shares }}</td>
                    <td>{{ stock.price | usd }}</td>
                    <td>{{ stock.total | usd }}</td>
                </tr>
            {% endfor %}

            <tr>
                <td colspan="3" class="text-end"><strong>Cash</strong></td>
                <td>{{ cash | usd }}</td>
            </tr>

            <tr>
                <td colspan="3" class="text-end"><strong>TOTAL</strong></td>
                <td>{{ total | usd }}</td>
            </tr>
        </tbody>
    </table>

{% endblock %}
